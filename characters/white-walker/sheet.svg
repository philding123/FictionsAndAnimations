<text x="596" y="798" font-family='"Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif' font-size="13.5" fill="#C8CCD0">彩，一时白如新雪、一时黑如暗影，</text>
<text x="596" y="819" font-family='"Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif' font-size="13.5" fill="#C8CCD0">处处点缀森林的深奥灰绿，如水面粼</text>
